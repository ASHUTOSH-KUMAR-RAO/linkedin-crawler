version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lre
      POSTGRES_PASSWORD: lre_local_password
      POSTGRES_DB: lead_research_engine
    ports:
      - "5432:5432"
    volumes:
      - lre_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lre -d lead_research_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lre-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lre_postgres_data:
